set -g default-terminal "xterm-256color"
set -g status on
set -g status-position bottom
set -g status-style "bg=#1f242c,fg=#8b949e"
set -g status-left " #[fg=#58a6ff,bold]nats-qnx#[fg=#8b949e]  ::  QNX Neutrino 8.0 "
set -g status-left-length 48
set -g status-right " #[fg=#7ee787]QNX 8.0#[fg=#8b949e] <-> #[fg=#d2a8ff]nats-server v2.15.3 "
set -g status-right-length 56
set -g pane-border-status top
set -g pane-border-format " #[bold]#{pane_title} "
set -g pane-border-style "fg=#30363d"
set -g pane-active-border-style "fg=#58a6ff"
set -g window-status-format ""
set -g window-status-current-format ""
